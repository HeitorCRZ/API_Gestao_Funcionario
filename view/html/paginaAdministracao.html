<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página principal</title>
  <link rel="stylesheet" href="../css/paginaAdministracao.css" />
</head>

<body>

  <nav class="navbar fixed-top custom-navbar">
    <div class="container-fluid justify-content-center align-items-center d-flex">
      <span class="navbar-title">Sistema de Gestão de Funcionários - AppStorm</span>
    </div>
  </nav>


  <!-- Layout geral -->
  <main class="painel-geral">
    <!-- Painel com os cards -->
    <div class="painel-relatorio">
      <div class="card card-salario">
        <img src="mediaSalaria.jpg" class="card-img-top" alt="...">
        <div class="card-body">
          <h5 class="card-title">Funcionários</h5>
          <p class="card-text">Média salarial: <span class="info-salario">...</span></p>
        </div>
      </div>

      <div class="card card-qtd-funcionarios">
        <img src="quantidadeFuncionarios.jpeg" class="card-img-top" alt="...">
        <div class="card-body">
          <h5 class="card-title">Funcionários</h5>
          <p class="card-text">Quantidade: <span class="info-qtd-funcionarios">...</span></p>
          Funcionários sem perfil: <span class="info-semPerfil">...</span>
        </div>
      </div>

      <div class="card card-departamentos">
        <img src="departamentos.jpg" class="card-img-top" alt="...">
        <div class="card-body">
          <h5 class="card-title">Departamentos</h5>
          <p class="card-text">Número: <span class="info-departamentos">...</span></p>
        </div>
      </div>

      <div class="card card-genero">
        <img src="proporcaoGenero.jpeg" class="card-img-top" alt="...">
        <div class="card-body">
          <h5 class="card-title">Proporção de gênero</h5>
          <p class="card-text">
            Masculino: <span class="info-masculino">...</span><br />
            Feminino: <span class="info-feminino">...</span>
          </p>
        </div>
      </div>
    </div>

    <!-- Sidebar com os botões -->
    <div class="sidebar-botoes">
      <button class="btn-sidebar" id="btn-funcionarios">Gestão de Funcionários</button>
      <button class="btn-sidebar" id="btn-departamentos">Gestão de Departamentos</button>
      <button class="btn-sidebar" id="btn-graficos">Ver Gráficos</button>
      <button class="btn-sidebar" id="btn-log">Ver Log do Sistema</button>
    </div>
  </main>

  <script>
    async function carregarRelatorio() {
      try {
        const resposta = await fetch("/funcionarios/relatorio");
        const dados = await resposta.json();

        if (dados.status && dados.relatorio) {
          const relatorio = dados.relatorio;

          const mediaSalarial = parseFloat(relatorio.media_salarial_geral).toLocaleString('pt-BR', {
            style: 'currency',
            currency: 'BRL'
          });
          document.querySelector(".info-salario").textContent = mediaSalarial;

          document.querySelector(".info-qtd-funcionarios").textContent = relatorio.total_funcionarios;
          document.querySelector(".info-departamentos").textContent = relatorio.distribuicao_salarial_departamento.length;

          const generoMasculino = relatorio.proporcao_genero.find(g => g.genero === "Masculino")?.total || 0;
          const generoFeminino = relatorio.proporcao_genero.find(g => g.genero === "Feminino")?.total || 0;

          document.querySelector(".info-masculino").textContent = generoMasculino;
          document.querySelector(".info-feminino").textContent = generoFeminino;

          const funcionariosSemPerfil = relatorio.total_funcionarios-generoFeminino-generoMasculino;
          document.querySelector(".info-semPerfil").textContent = funcionariosSemPerfil;

        } else {
          console.error("Erro ao obter relatório:", dados.msg);
        }
      } catch (erro) {
        console.error("Erro na requisição do relatório:", erro);
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      carregarRelatorio();

      // Redirecionamento dos botões
      document.getElementById("btn-funcionarios").addEventListener("click", () => {
        window.location.href = "formsFuncionarios.html";
      });

      document.getElementById("btn-departamentos").addEventListener("click", () => {
        window.location.href = "formsDepartamentos.html";
      });

      document.getElementById("btn-graficos").addEventListener("click", () => {
        window.location.href = "grafico.html";
      });

      document.getElementById("btn-log").addEventListener("click", () => {
        window.location.href = "logs.html";
      });
    });
  </script>

</body>

</html>
