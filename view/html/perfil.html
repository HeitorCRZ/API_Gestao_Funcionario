<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Perfil do Funcionário</title>
  <link rel="stylesheet" href="../css/perfil.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>
  <div class="container mt-5">
    <!-- Navbar -->
    <nav class="navbar fixed-top custom-navbar">
      <div class="container-fluid justify-content-center align-items-center d-flex position-relative">
        <span class="navbar-title mx-auto">Perfil - AppStorm</span>
        <button type="button" class="btn-close position-absolute start-0 ms-3" id="btnFechar" aria-label="Close"
          style="transform: scale(1.8); filter: invert(19%) sepia(99%) saturate(7074%) hue-rotate(355deg) brightness(96%) contrast(119%); z-index: 1051;">
        </button>
      </div>
    </nav>

    <!-- Conteúdo do Perfil -->
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="profile-card text-center">
          <img id="foto" src="https://via.placeholder.com/150" alt="Foto do Funcionário" class="profile-img mb-3" />
          <h3 id="nome" class="mb-0">Carregando...</h3>
          <p id="cargo" class="text-muted"></p>

          <hr>

          <div class="text-start mt-4">
            <p><strong>Idade:</strong> <span id="idade"></span></p>
            <p><strong>Gênero:</strong> <span id="genero"></span></p>
            <p><strong>Estado Civil:</strong> <span id="estado_civil"></span></p>
            <p><strong>Endereço:</strong> <span id="endereco"></span></p>
            <p><strong>Email:</strong> <span id="email"></span></p>
            <p><strong>Telefone:</strong> <span id="telefone"></span></p>
            <p><strong>CPF:</strong> <span id="cpf"></span></p>
            <p><strong>Salário:</strong> R$ <span id="salario"></span></p>
            <p><strong>Data de Contratação:</strong> <span id="data_contratacao"></span></p>
          </div>

          <hr>

          <!-- Histórico de Cargos -->
          <div class="text-start mt-4">
            <h5>Histórico de Cargos</h5>
            <ul id="historico-cargos" class="list-group mt-3">
              <!-- Itens do histórico serão inseridos aqui via JavaScript -->
            </ul>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script>
    const usuario = JSON.parse(localStorage.getItem("usuario"));
    const id = usuario?.id;
    console.log("ID do usuário:", id);

    if (id) {
      carregarPerfil(id);
    } else {
      alert("ID do funcionário não encontrado.");
      window.location.href = "login.html"; // Redireciona se não tiver ID
    }

    async function carregarPerfil(id) {
      try {
        const [funcRes, perfilRes] = await Promise.all([
          fetch(`/funcionarios/buscar/${id}`),
          fetch(`/perfis/buscar/${id}`)
        ]);

        const funcData = await funcRes.json();
        const perfilData = await perfilRes.json();

        if (funcData.status && perfilData.status) {
          const func = funcData.dados[0];
          const perfil = perfilData.dados[0];

          // Preencher dados do funcionário
          document.getElementById("nome").textContent = func.nome;
          document.getElementById("cargo").textContent = func.cargo;
          document.getElementById("email").textContent = func.email;
          document.getElementById("cpf").textContent = func.cpf;
          document.getElementById("salario").textContent = parseFloat(func.salario).toFixed(2);
          document.getElementById("data_contratacao").textContent = new Date(func.data_contratacao).toLocaleDateString("pt-BR");

          // Preencher dados do perfil
          document.getElementById("idade").textContent = perfil.idade;
          document.getElementById("genero").textContent = perfil.genero;
          document.getElementById("estado_civil").textContent = perfil.estado_civil;
          document.getElementById("endereco").textContent = perfil.endereco;
          document.getElementById("telefone").textContent = perfil.telefone;

          const foto = document.getElementById("foto");
          if (perfil.imagem && perfil.imagem.trim() !== "") {
            foto.src = `../../uploads/fotos/${perfil.imagem}`;
          } else {
            foto.src = "https://via.placeholder.com/150?text=Sem+Imagem";
          }

          carregarHistoricoCargos(id);
        } else {
          alert("Erro ao carregar os dados do funcionário.");
        }
      } catch (error) {
        console.error("Erro ao buscar os dados:", error);
        alert("Erro ao carregar perfil.");
      }
    }

    async function carregarHistoricoCargos(id) {
      try {
        const res = await fetch(`/cargos/buscar/${id}`);
        const data = await res.json();

        const lista = document.getElementById("historico-cargos");
        lista.innerHTML = "";

        if (data.status && data.dados.length > 0) {
          data.dados.forEach(item => {
            const li = document.createElement("li");
            li.className = "list-group-item";
            li.innerHTML = `
              <strong>De:</strong> ${item.cargo_anterior} 
              <strong>Para:</strong> ${item.novo_cargo}
              <br>
              <small><strong>Data:</strong> ${new Date(item.data_alteracao).toLocaleDateString("pt-BR")}</small>
            `;
            lista.appendChild(li);
          });
        } else {
          lista.innerHTML = "<li class='list-group-item'>Nenhuma alteração de cargo registrada.</li>";
        }
      } catch (error) {
        console.error("Erro ao carregar histórico de cargos:", error);
      }
    }

    document.getElementById("btnFechar").addEventListener("click", () => {
      const funcionarioData = JSON.parse(localStorage.getItem("Funcionario"));
      const cargo = funcionarioData?.cargo;

      localStorage.removeItem("usuario");

      if (cargo === "Administração") {
        window.location.href = "formsFuncionarios.html";
      } else {
        window.location.href = "login.html";
      }
    });
  </script>

  <!-- Bootstrap Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
