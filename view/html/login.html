<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppStorm</title>
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>
    <main>
        <div class="container">
            <div class="header">
                <div class="logo">
                    <img src="./appstorm_logo.jpeg">
                </div>
                <h2>Sistema de Gestão Funcionarios</h2>
                <h2>AppStorm</h2>
            </div>

            <div class="login_body">
                <form>
                    <div class="input_box">
                        <input type="text" placeholder="Email" id="emailtxt" required>
                    </div>

                    <div class="input_box">
                        <input type="password" placeholder="Senha" id="senhatxt" required>
                    </div>

                    <div>
                        <button id="buttonOK" type="button" class="buttonOK">Entrar</button>
                    </div>

                    <div id="error-message" class="errorMensagge" style="display: none;"></div>
                </form>
            </div>
        </div>
    </main>

    <script>
        const mensage_error = document.getElementById("error-message");
        const buttonOK = document.getElementById("buttonOK");
        const emailtxt = document.getElementById("emailtxt");
        const senhatxt = document.getElementById("senhatxt");

        buttonOK.onclick = function () {
            login();
        };

        function login() {
            let email = emailtxt.value;
            let senha = senhatxt.value;

            let jsonEnvio = {
                "email": email,
                "senha": senha
            };

            let uri = '/funcionarios/login';
            fetch(uri, {
                method: "POST",
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(jsonEnvio)
            }).then((response) => {
                return response.text();
            }).then((data) => {
                processarResultados(data)

            }).catch((error) => {
                console.log(error);
            });

        }
        function processarResultados(texto_json) {
            const respJson = JSON.parse(texto_json);
            try {
                if (respJson.status == false) {
                    mensage_error.textContent = respJson.error;
                    mensage_error.style.display = "block";
                    return;
                } else {
                    mensage_error.style.display = "none";
                    localStorage.setItem("Funcionario", JSON.stringify(respJson));

                    fetch(`/perfis/buscar/${respJson.id}`, {
                        method: "GET",
                        headers: {
                            'Accept': 'application/json'
                        }
                    }).then(response => response.json())
                        .then(data => {
                            if (respJson.cargo === "Administração") {
                                window.location.href = "../html/paginaAdminstrador.html";
                            } else {
                                if (data.status === false) {
                                    window.location.href = "../html/cadastrarPerfil.html";
                                } else {
                                    window.location.href = "../html/paginaFuncionario.html";
                                }
                            }

                        }).catch(error => {
                            console.error("Erro ao buscar perfil:", error);
                            mensage_error.textContent = "Erro ao verificar o perfil.";
                            mensage_error.style.display = "block";
                        });
                }
            } catch (error) {
                console.error("Erro ao processar o JSON:", error);
                mensage_error.textContent = "Erro ao processar a resposta do servidor.";
                mensage_error.style.display = "block";
            }
        }

    </script>
</body>

</html>
