<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/grafico.css" />
  
  <!-- BOOTSTRAP CSS e JS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- amCharts -->
  <script src="https://cdn.amcharts.com/lib/4/core.js"></script>
  <script src="https://cdn.amcharts.com/lib/4/charts.js"></script>
  <script src="https://cdn.amcharts.com/lib/4/themes/animated.js"></script>

  <title>Gráficos</title>
</head>

<body>
  <nav class="navbar fixed-top custom-navbar">
    <div class="container-fluid justify-content-center align-items-center d-flex position-relative">
      <span class="navbar-title mx-auto">Logs - AppStorm</span>
      <button type="button" class="btn-close position-absolute start-0 ms-3" aria-label="Close"
        onclick="window.location.href='paginaAdministracao.html';"
        style="transform: scale(1.8); filter: invert(19%) sepia(99%) saturate(7074%) hue-rotate(355deg) brightness(96%) contrast(119%); z-index: 1051;">
      </button>
    </div>
  </nav>

  <div class="container mt-5 pt-5">
    <!-- KPIs -->
    <div class="row text-center mb-5">
      <div class="col-md-4 mb-3">
        <div class="card shadow-sm p-3 h-100">
          <h6 class="text-muted">Média Salarial Geral</h6>
          <p class="fs-5 fw-semibold text-primary" id="info-salario">Carregando...</p>
        </div>
      </div>
      <div class="col-md-4 mb-3">
        <div class="card shadow-sm p-3 h-100">
          <h6 class="text-muted">Total de Funcionários</h6>
          <p class="fs-5 fw-semibold" id="info-funcionarios">Carregando...</p>
        </div>
      </div>
      <div class="col-md-4 mb-3">
        <div class="card shadow-sm p-3 h-100">
          <h6 class="text-muted">Total de Departamentos</h6>
          <p class="fs-5 fw-semibold" id="info-departamentos">Carregando...</p>
        </div>
      </div>
    </div>

    <!-- Gráfico Salarial -->
    <div class="graficoOcorrencias mb-5">
      <h3 class="mb-3 text-center text-secondary">Distribuição Salarial</h3>
      <div id="graficoSalarial" style="width: 100%; height: 450px;"></div>
    </div>

    <!-- Gráfico de Idade -->
    <div class="graficoOcorrencias mb-5">
      <h3 class="mb-3 text-center text-secondary">Idade por Departamento</h3>
      <div id="graficoDepartamento" style="width: 100%; height: 450px;"></div>
    </div>
  </div>

  <script>
    const usuario = JSON.parse(localStorage.getItem("Funcionario"));
    const token = usuario.token;

    async function carregarRelatorio() {
      try {
        const uri_funcionarios_relatorios = "/funcionarios/relatorios";
        const response = await fetch(uri_funcionarios_relatorios, {
          method: "GET",
          headers: {
            "Accept": "application/json",
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token,
          },
        });

        const data = await response.json();

        if (data.status && data.relatorio) {
          const relatorio = data.relatorio;

          // KPIs
          document.getElementById("info-salario").textContent = formatarMoeda(parseFloat(relatorio.media_salarial_geral));
          document.getElementById("info-funcionarios").textContent = relatorio.total_funcionarios;
          document.getElementById("info-departamentos").textContent = relatorio.distribuicao_salarial_departamento.length;

          desenharGraficoSalarial(relatorio.distribuicao_salarial_departamento);
          desenharGraficoIdade(relatorio.idade_media_departamento);
        } else {
          console.error("Erro ao obter relatório:", data.msg);
        }
      } catch (erro) {
        console.error("Erro na requisição do relatório:", erro);
      }
    }

    function formatarMoeda(valor) {
      return valor.toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      });
    }

    function desenharGraficoSalarial(data) {
      am4core.useTheme(am4themes_animated);
      const chart = am4core.create("graficoSalarial", am4charts.XYChart);
      chart.colors.step = 2;
      chart.legend = new am4charts.Legend();
      chart.legend.position = "top";
      chart.paddingBottom = 20;

      chart.data = data.map(dep => ({
        category: dep.departamento,
        media_salarial: parseFloat(dep.media_salarial),
        total_salarial: parseFloat(dep.total_salarial)
      }));

      const xAxis = chart.xAxes.push(new am4charts.CategoryAxis());
      xAxis.dataFields.category = "category";
      xAxis.renderer.cellStartLocation = 0.1;
      xAxis.renderer.cellEndLocation = 0.9;
      xAxis.renderer.grid.template.location = 0;

      const yAxis = chart.yAxes.push(new am4charts.ValueAxis());
      yAxis.min = 0;

      function createSeries(field, name) {
        const series = chart.series.push(new am4charts.ColumnSeries());
        series.dataFields.valueY = field;
        series.dataFields.categoryX = "category";
        series.name = name;
        series.columns.template.tooltipText = "{name}: [bold]{valueY}[/]";

        const bullet = series.bullets.push(new am4charts.LabelBullet());
        bullet.label.text = "{valueY}"; // <-- Agora o adapter vai funcionar
        bullet.label.adapter.add("text", function (text, target) {
          const value = target.dataItem?.values?.valueY?.value;
          return value ? formatarMoeda(value) : text;
        });
        bullet.label.fill = am4core.color("#fff");
        bullet.dy = 13;

        return series;
      }

      createSeries("media_salarial", "Média Salarial");
      createSeries("total_salarial", "Total Salarial");
    }

    function desenharGraficoIdade(data) {
      am4core.useTheme(am4themes_animated);
      const chart = am4core.create("graficoDepartamento", am4charts.XYChart);
      chart.colors.step = 2;
      chart.legend = new am4charts.Legend();
      chart.legend.position = "top";
      chart.paddingBottom = 20;

      chart.data = data.map(dep => ({
        category: dep.departamento,
        idade_media: parseFloat(dep.idade_media)
      }));

      const xAxis = chart.xAxes.push(new am4charts.CategoryAxis());
      xAxis.dataFields.category = "category";
      xAxis.renderer.cellStartLocation = 0.1;
      xAxis.renderer.cellEndLocation = 0.9;
      xAxis.renderer.grid.template.location = 0;

      const yAxis = chart.yAxes.push(new am4charts.ValueAxis());
      yAxis.min = 0;
      yAxis.max = 100;

      const series = chart.series.push(new am4charts.ColumnSeries());
      series.dataFields.valueY = "idade_media";
      series.dataFields.categoryX = "category";
      series.name = "Idade Média";
      series.columns.template.tooltipText = "{name}: [bold]{valueY}[/]";

      const bullet = series.bullets.push(new am4charts.LabelBullet());
      bullet.label.text = "{valueY}";
      bullet.label.fill = am4core.color("#fff");
      bullet.dy = 13;
    }

    window.addEventListener("DOMContentLoaded", carregarRelatorio);
  </script>

</body>

</html>
