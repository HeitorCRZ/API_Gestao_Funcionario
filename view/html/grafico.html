<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/graficoteste.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Document</title>
</head>

<body>
    <div class="proporcao-genero mt-5">
        <h3>Proporção de Gênero(Funcionários que ainda não montaram seu perfil não são contabilizados)</h3>
        <div class="grafico-genero-container">
            <canvas id="graficoGenero"></canvas>
        </div>
    </div>
    <!-- Resources -->
    <script src="https://cdn.amcharts.com/lib/4/core.js"></script>
    <script src="https://cdn.amcharts.com/lib/4/charts.js"></script>
    <script src="https://cdn.amcharts.com/lib/4/themes/animated.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Chart code -->
    <script>
        am4core.ready(function () {

            // Themes begin
            am4core.useTheme(am4themes_animated);
            // Themes end



            var chart = am4core.create('chartdiv', am4charts.XYChart)
            chart.colors.step = 2;

            chart.legend = new am4charts.Legend()
            chart.legend.position = 'top'
            chart.legend.paddingBottom = 20
            chart.legend.labels.template.maxWidth = 95

            var xAxis = chart.xAxes.push(new am4charts.CategoryAxis())
            xAxis.dataFields.category = 'category'
            xAxis.renderer.cellStartLocation = 0.1
            xAxis.renderer.cellEndLocation = 0.9
            xAxis.renderer.grid.template.location = 0;

            var yAxis = chart.yAxes.push(new am4charts.ValueAxis());
            yAxis.min = 0; // Define o mínimo do eixo Y
            yAxis.max = 10; // Define o máximo (opcional, ajuste ao seu gráfico)
            yAxis.strictMinMax = true; // Garante que o eixo use os limites definidos
            yAxis.renderer.grid.template.disabled = false; // Garante que as linhas da grade sejam exibidas
            yAxis.renderer.minGridDistance = 20; // Evita colisões entre rótulos
            yAxis.renderer.grid.step = 1; // Define a razão da grade como 1


            function createSeries(value, name) {
                var series = chart.series.push(new am4charts.ColumnSeries())
                series.dataFields.valueY = value
                series.dataFields.categoryX = 'category'
                series.name = name

                series.events.on("hidden", arrangeColumns);
                series.events.on("shown", arrangeColumns);

                var bullet = series.bullets.push(new am4charts.LabelBullet())
                bullet.interactionsEnabled = false
                bullet.dy = 13;
                bullet.label.text = '{valueY}'
                bullet.label.fill = am4core.color('#ffffff')

                return series;
            }

            chart.data = [
                {
                    category: '1º bimestre',
                    ocorrencias: 3,
                    advertencias: 2,
                    suspensao: 2,

                    marketin: 2,
                    tecn: 2,
                    adm: 2,

                    maraketin: 2,
                    teacn: 2,
                    adam: 2,

                }
            ]


            createSeries('ocorrencias', 'ocorrência');
            createSeries('advertencias', 'advertência');
            createSeries('suspensao', 'suspensão');
            createSeries('marketin', 'marketin');
            createSeries('tecn', 'tecn');
            createSeries('adm', 'adm');
            createSeries('maraketin', 'marketin');
            createSeries('teacn', 'tecn');
            createSeries('adam', 'adm');

            function arrangeColumns() {

                var series = chart.series.getIndex(0);

                var w = 1 - xAxis.renderer.cellStartLocation - (1 - xAxis.renderer.cellEndLocation);
                if (series.dataItems.length > 1) {
                    var x0 = xAxis.getX(series.dataItems.getIndex(0), "categoryX");
                    var x1 = xAxis.getX(series.dataItems.getIndex(1), "categoryX");
                    var delta = ((x1 - x0) / chart.series.length) * w;
                    if (am4core.isNumber(delta)) {
                        var middle = chart.series.length / 2;

                        var newIndex = 0;
                        chart.series.each(function (series) {
                            if (!series.isHidden && !series.isHiding) {
                                series.dummyData = newIndex;
                                newIndex++;
                            }
                            else {
                                series.dummyData = chart.series.indexOf(series);
                            }
                        })
                        var visibleCount = newIndex;
                        var newMiddle = visibleCount / 2;

                        chart.series.each(function (series) {
                            var trueIndex = chart.series.indexOf(series);
                            var newIndex = series.dummyData;

                            var dx = (newIndex - trueIndex + middle - newMiddle) * delta

                            series.animate({ property: "dx", to: dx }, series.interpolationDuration, series.interpolationEasing);
                            series.bulletsContainer.animate({ property: "dx", to: dx }, series.interpolationDuration, series.interpolationEasing);
                        })
                    }
                }
            }

        }); // end am4core.ready()

        async function carregarRelatorio() {
            try {
                const resposta = await fetch("/funcionarios/relatorio");
                const dados = await resposta.json();

                if (dados.status && dados.relatorio) {
                    const relatorio = dados.relatorio;
                    console.log("Relatório recebido:", relatorio);

                    // Atualiza os cards principais
                    document.querySelector(".card-blue .info-value").textContent = relatorio.total_funcionarios;

                    const mediaSalarial = parseFloat(relatorio.media_salarial_geral).toLocaleString('pt-BR', {
                        style: 'currency',
                        currency: 'BRL'
                    });
                    document.querySelector(".card-green .info-value").textContent = mediaSalarial;

                    const numDepartamentos = relatorio.distribuicao_salarial_departamento.length;
                    document.querySelector(".card-yellow .info-value").textContent = numDepartamentos;

                    // Gráfico de proporção de gênero
                    const ctxGenero = document.getElementById('graficoGenero').getContext('2d');
                    const generos = relatorio.proporcao_genero.map(item => item.genero);
                    const totais = relatorio.proporcao_genero.map(item => item.total);

                    new Chart(ctxGenero, {
                        type: 'pie',
                        data: {
                            labels: generos,
                            datasets: [{
                                data: totais,
                                backgroundColor: ['#4e73df', '#e83e8c'], // Azul e rosa
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: {
                                    position: 'bottom'
                                },
                                title: {
                                    display: true,
                                    text: 'Proporção de Gênero'
                                }
                            }
                        }
                    });

                } else {
                    console.error("Erro ao obter relatório:", dados.msg);
                }
            } catch (erro) {
                console.error("Erro na requisição do relatório:", erro);
            }
        }

        window.addEventListener("DOMContentLoaded", carregarRelatorio);
    </script>

    <!-- HTML -->
    <div id="chartdiv"></div>
</body>

</html>

.grafico-genero-container {
    max-width: 600px;
    margin: auto;
}
#graficoGenero {
    width: 100% !important;
    height: auto !important;
}
