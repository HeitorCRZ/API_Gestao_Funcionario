<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/formsFuncionarios.css">

    <!-- fontes das letras -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">



    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- BOOTSTRAP CSS e JS (um único conjunto) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</head>

<body>

    <main>
        <header>
            <nav class="navbar fixed-top custom-navbar">
                <div class="container-fluid justify-content-center align-items-center d-flex position-relative">
                    <span class="navbar-title mx-auto">Gestão de Funcionários - AppStorm</span>
                    <button type="button" class="btn-close position-absolute start-0 ms-3" aria-label="Close"
                        onclick="window.location.href='paginaAdministracao.html';"
                        style="transform: scale(1.8); filter: invert(19%) sepia(99%) saturate(7074%) hue-rotate(355deg) brightness(96%) contrast(119%); z-index: 1051;">
                    </button>
                </div>
            </nav>

            <div class="container">

                <div class="container mt-4">
                    <h2>Listagem dos funcionarios</h2>
                    <div class="row g-2 my-3">
                        <div class="col-md-4">
                            <input type="text" id="filtroNome" class="form-control" placeholder="Filtrar por Nome">
                        </div>
                        <div class="col-md-4">
                            <input type="text" id="filtroCargo" class="form-control" placeholder="Filtrar por Cargo">
                        </div>
                        <div class="col-md-4">
                            <select id="filtroDepartamento" class="form-select">
                                <option value="">Todos os Departamentos</option>
                                <!-- opções inseridas dinamicamente -->
                            </select>
                        </div>
                    </div>

                    <table id="TabelaGetOpcao" class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Email</th>
                                <th>CPF</th>
                                <th>Cargo</th>
                                <th>Salário</th>
                                <th>Contrato</th>
                                <th>Departamento</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <!-- O <tbody> será criado dinamicamente -->
                    </table>
                    <div id="spinnerContainer" style="display: none;">
                        <div class="spinner-border text-primary" role="status" style="margin: auto;">
                            <span class="visually-hidden">Carregando...</span>
                        </div>
                    </div>


                    <div class="d-flex justify-content-center align-items-center gap-3 mt-4">
                        <button id="btnAnterior" class="btn btn-outline-secondary" onclick="paginaAnterior()">←
                            Anterior</button>

                        <nav>
                            <ul class="pagination mb-0">
                                <li class="page-item active"><span class="page-link" id="numPagina">1</span></li>
                            </ul>
                        </nav>

                        <button id="btnProximo" class="btn btn-outline-secondary" onclick="proximaPagina()">Próxima
                            →</button>

                    </div>
                </div>

                <div class="mt-5">
                    <h5>Cadastro de Funcionário</h5>
                    <button class="btn btn-primary mb-3" data-bs-toggle="modal"
                        data-bs-target="#modalCadastroFuncionario">
                        Cadastrar Manualmente
                    </button>

                    <!-- Cadastro via arquivo -->
                    <h6>Ou envie um arquivo (JSON ou CSV)</h6>
                    <form id="formUploadArquivo" enctype="multipart/form-data">
                        <div class="row g-2 align-items-center">
                            <div class="col-md-6">
                                <input type="file" id="variavelArquivo" class="form-control" accept=".json,.csv"
                                    required>
                            </div>
                            <div class="col-md-2">
                                <button type="submit" class="btn btn-secondary" id="CadastroFuncionarioArquivo">Enviar
                                    Arquivo</button>
                            </div>
                            <div id="error-message_post_arquivo" class="text-danger" style="display: none;">
                            </div>

                        </div>
                    </form>
                </div>

            </div>

            <!--<div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="modalUpdateLabel">Editar Funcionário</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"
                                    aria-label="Close"></button>                    <div class="modal-dialog  customizar-tabelaFuncionario">

                            </div>  -->

            <!-- Modal de Atualização -->
            <div class="modal fade" id="modalEdicaoFuncionario" tabindex="-1" aria-labelledby="modalEditarLabel"
                aria-hidden="true">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content">
                        <form id="formAtualizarFuncionario">
                            <div class="modal-header">
                                <h5 class="modal-title" id="modalEditarLabel">Atualizar Funcionário</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"
                                    aria-label="Fechar"></button>
                            </div>
                            <div class="modal-body">
                                <input type="hidden" id="id">
                                <div class="row g-2">
                                    <div class="col-md-6">
                                        <input type="text" id="nome" class="form-control" placeholder="Nome" required>
                                    </div>
                                    <div class="col-md-4 mt-2">
                                        <input type="text" id="cpf" class="form-control" placeholder="CPF" required>
                                    </div>
                                    <div class="col-md-4 mt-2">
                                        <input type="text" id="cargo" class="form-control" placeholder="Cargo" required>
                                    </div>
                                    <div class="col-md-4 mt-2">
                                        <input type="number" id="salario" class="form-control" placeholder="Salário"
                                            required>
                                    </div>
                                    <div class="col-md-4 mt-2">
                                        <input type="date" id="dataContrato" class="form-control" placeholder="Contrato"
                                            required>
                                    </div>
                                    <div class="col-md-6 mt-2">
                                        <input type="number" id="departamento_id" class="form-control"
                                            placeholder="Departamento ID" required>
                                    </div>
                                    <div id="error-message" class="text-danger mt-2" style="display: none;">
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button class="btn btn-primary" id="botaoAtualizar">Atualizar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Modal -->


            </div>
            </div>
            </div>

            </div>
            </div>
        </header>
    </main>
    <!-- Modal de Cadastro Manual -->
    <div class="modal fade" id="modalCadastroFuncionario" tabindex="-1" aria-labelledby="modalCadastroLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form id="formCadastroUnico">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalCadastroLabel">Cadastro de Funcionário</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row g-2">
                            <div class="col-md-6">
                                <input type="text" id="nomePost" class="form-control" placeholder="Nome" required>
                            </div>
                            <div class="col-md-6">
                                <input type="email" id="emailPost" class="form-control" placeholder="Email" required>
                            </div>
                            <div class="col-md-4 mt-2">
                                <input type="text" id="cpfPost" class="form-control" placeholder="CPF" required>
                            </div>
                            <div class="col-md-4 mt-2">
                                <input type="text" id="cargoPost" class="form-control" placeholder="Cargo" required>
                            </div>
                            <div class="col-md-4 mt-2">
                                <input type="number" id="salarioPost" class="form-control" placeholder="Salário"
                                    required>
                            </div>
                            <div class="col-md-4 mt-2">
                                <input type="date" id="dataContratoPost" class="form-control" placeholder="Contrato"
                                    required>
                            </div>
                            <div class="col-md-6 mt-2">
                                <select id="departamento_idPost" class="form-control" required>
                                    <option value="">Selecione o Departamento</option>
                                </select>
                            </div>
                            <div class="col-md-6 mt-2">
                                <input type="password" id="senhaPost" class="form-control" placeholder="senha" required>
                            </div>
                            <div id="mensage_error_post" style="display:none;"></div>

                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-success" id="CadastroFuncionario">
                            Cadastrar
                        </button>

                    </div>
                </form>
            </div>
        </div>
    </div>


    <script>
        const funcionario = JSON.parse(localStorage.getItem("Funcionario"));
        const token = funcionario.token
        let paginaAtual = 1;
        const itensPorPagina = 5;
        let ultimaPagina = false;
        const mensage_error = document.getElementById("error-message");
        const botaoAtualizar = document.getElementById("botaoAtualizar")
        const botaoCadastro = document.getElementById("CadastroFuncionario")
        const mensage_error_post = document.getElementById("error-message_post");

        const botaoCadastroArquivo = document.getElementById("CadastroFuncionarioArquivo")
        const mensage_error_arquivo = document.getElementById("error-message_post_arquivo");

        const funcionarioData = JSON.parse(localStorage.getItem("Funcionario"));
        const usuario_logado = funcionarioData?.id;

        async function carregarFuncionarios(pagina = 1) {
            try {
                mostrarSpinner(true);
                const response = await fetch(`/funcionarios/buscarPagina/${pagina}`, {
                    method: "GET", // opcional, pois GET é o padrão
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": 'Bearer ' + token
                    }
                });

                const json = await response.json();

                if (json.status) {
                    montarTabelaOpcao(json);
                    paginaAtual = pagina;
                    document.getElementById("numPagina").textContent = paginaAtual;

                    document.getElementById("btnAnterior").disabled = paginaAtual === 1;
                    document.getElementById("btnProximo").disabled = ultimaPagina = json.dados.length < itensPorPagina;
                } else {
                    alert("Erro ao carregar funcionários.");
                }

            } catch (erro) {
                console.error("Erro na requisição:", erro);
            } finally {
                mostrarSpinner(false);
            }
        }

        function proximaPagina() {
            if (!ultimaPagina) {
                carregarFuncionarios(paginaAtual + 1);
            }
        }

        function paginaAnterior() {
            if (paginaAtual > 1) {
                carregarFuncionarios(paginaAtual - 1);
            }
        }

        function mostrarSpinner(mostrar) {
            const spinner = document.getElementById("spinnerContainer");
            spinner.style.display = mostrar ? "block" : "none";
        }

        function aplicarFiltros() {
            const nomeFiltro = document.getElementById("filtroNome").value.toLowerCase();
            const cargoFiltro = document.getElementById("filtroCargo").value.toLowerCase();
            const departamentoFiltro = document.getElementById("filtroDepartamento").value;

            const linhas = TabelaGetOpcao.querySelectorAll("tbody tr");

            linhas.forEach(linha => {
                const colunas = linha.querySelectorAll("td");

                const nome = colunas[1]?.textContent.toLowerCase() || "";
                const cargo = colunas[4]?.textContent.toLowerCase() || "";
                const departamento = colunas[7]?.textContent || "";

                const nomeMatch = nome.includes(nomeFiltro);
                const cargoMatch = cargo.includes(cargoFiltro);
                const depMatch = departamentoFiltro === "" || departamento === departamentoFiltro;

                if (nomeMatch && cargoMatch && depMatch) {
                    linha.style.display = "";
                } else {
                    linha.style.display = "none";
                }
            });
        }


        document.addEventListener("DOMContentLoaded", async () => {
            try {

                const uri_get_departamentos = "/departamentos/buscar";
                console.log("chegou departamentos");
                fetch(uri_get_departamentos, {
                    method: "GET",
                    headers: {
                        "Accept": "application/json",
                        "Content-Type": "application/json",
                        "Authorization": 'Bearer ' + token
                    }
                }).then((response) => {
                    return response.json();
                }).then((data) => {
                    const filtroSelect = document.getElementById('filtroDepartamento');
                    data.dados.forEach(dep => {
                        const option = document.createElement('option');
                        option.value = dep.id;
                        option.textContent = dep.nome;
                        filtroSelect.appendChild(option);
                    });
                    const select = document.getElementById('departamento_idPost');
                    data.dados.forEach(dep => {
                        const option = document.createElement('option');
                        option.value = dep.id; // ou o nome correto do campo de ID
                        option.textContent = dep.nome; // ou o nome correto do campo de nome
                        select.appendChild(option);
                    });
                })
            } catch (error) {
                console.error("Erro ao carregar departamentos:", error);
            }

        });
        document.addEventListener("DOMContentLoaded", () => {
            carregarFuncionarios(paginaAtual);
            document.getElementById("filtroNome").addEventListener("input", aplicarFiltros);
            document.getElementById("filtroCargo").addEventListener("input", aplicarFiltros);
            document.getElementById("filtroDepartamento").addEventListener("change", aplicarFiltros);

        });
        function formatarData(dataISO) {
            const data = new Date(dataISO);
            return data.toLocaleDateString('pt-BR', {
                timeZone: 'UTC'
            });
        }


        function montarTabelaOpcao(objJson_get) {
            console.log("chegou")
            let tbody = TabelaGetOpcao.querySelector("tbody");

            if (!tbody) {
                tbody = document.createElement("tbody");
                TabelaGetOpcao.appendChild(tbody);
            }
            console.log("dados" + objJson_get.status);
            console.log("dados" + objJson_get.nome);
            tbody.innerHTML = '';
            if (objJson_get.status == false) {
                mensage_error.textContent = "Sem resultados"
                mensage_error.style = "block";
            } else {
                console.log(objJson_get)
                mensage_error.style = "display: none";

                objJson_get.dados.forEach(dados_get => {
                    const linhaTabela = document.createElement('tr')
                    const colunas = [
                        dados_get.id,
                        dados_get.nome,
                        dados_get.email,
                        dados_get.cpf,
                        dados_get.cargo,
                        dados_get.salario,
                        formatarData(dados_get.data_contratacao),
                        dados_get.departamento_id
                    ];


                    colunas.forEach(valor => {
                        const colunaTabela = document.createElement('td')
                        colunaTabela.textContent = valor
                        linhaTabela.append(colunaTabela)
                    });

                    const colunaBotaoOpcao = document.createElement('td'); // Criando uma nova coluna para o botão
                    const btnExcluirFuncionario = document.createElement('button')
                    const btnAtualizarFuncionario = document.createElement('button')
                    const btnVisualizarPeril = document.createElement('button')


                    btnAtualizarFuncionario.textContent = 'Atualizar'; // Definindo o texto do botão

                    btnExcluirFuncionario.textContent = 'Excluir'; // Definindo o texto do botão
                    btnVisualizarPeril.textContent = 'Perfil'; // Definindo o texto do botão

                    colunaBotaoOpcao.appendChild(btnVisualizarPeril);
                    colunaBotaoOpcao.appendChild(btnAtualizarFuncionario);
                    colunaBotaoOpcao.appendChild(btnExcluirFuncionario);

                    linhaTabela.append(colunaBotaoOpcao)

                    tbody.appendChild(linhaTabela);

                    const obj = objJson_get
                    console.log(dados_get)

                    btnAtualizarFuncionario.onclick = function (event) {
                        event.preventDefault();

                        // Preenche os dados no formulário
                        document.getElementById("id").value = dados_get.id;
                        document.getElementById("nome").value = dados_get.nome;
                        document.getElementById("cpf").value = dados_get.cpf;
                        document.getElementById("cargo").value = dados_get.cargo;
                        document.getElementById("salario").value = dados_get.salario;
                        document.getElementById("dataContrato").value = formatarData(dados_get.data_contratacao);
                        document.getElementById("departamento_id").value = dados_get.departamento_id;

                        // Abre o modal
                        const modal = new bootstrap.Modal(document.getElementById('modalEdicaoFuncionario'));
                        modal.show();
                    }

                    btnExcluirFuncionario.onclick = function (event) {
                        event.preventDefault();

                        if (confirm("Tem certeza que deseja excluir este funcionário?")) {
                            deletarFuncionario(dados_get.id);
                        }
                    }


                    btnVisualizarPeril.onclick = function (event) {
                        event.preventDefault();
                        fetch(`/perfis/buscar/${dados_get.id}`)
                            .then(res => res.json())
                            .then(data => {
                                const temPerfil = data && data.status !== false && Array.isArray(data.dados) && data.dados.length > 0;

                                if (temPerfil) {
                                    const idUsuario = {
                                        id: dados_get.id
                                    };
                                    localStorage.setItem("usuario", JSON.stringify(idUsuario));
                                    window.location.href = "../html/perfil.html";
                                } else {
                                    alert("Este usuário ainda não possui um perfil cadastrado.");
                                }
                            })
                            .catch(err => {
                                alert("Erro ao buscar perfil.");
                                console.error(err);
                            });
                    }

                });

                TabelaGetOpcao.appendChild(tbody);
                TabelaGetOpcao.style.display = "block";
                aplicarFiltros();
            }
        }



        function deletarFuncionario(id) {
            const uri = `/funcionarios/deletar/${id}?usuario_logado=${encodeURIComponent(usuario_logado)}`;

            fetch(uri, {
                method: "DELETE",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": 'Bearer ' + token
                }

            }).then(res => res.json())
                .then(data => {
                    if (data.status == false) {
                        alert("Erro ao deletar");
                    } else {
                        alert("Funcionário deletado com sucesso!");
                        location.reload();
                    }
                }).catch(err => {
                    alert("Erro ao deletar.");
                    console.error(err);
                });
        }

        const formUploadArquivo = document.getElementById("formUploadArquivo");

        formUploadArquivo.addEventListener("submit", function (e) {
            e.preventDefault(); // Impede recarregamento automático
            cadastro_funcionario_arquivo();
        });

        function cadastro_funcionario_arquivo() {
            const inputArquivo = document.getElementById("variavelArquivo");
            if (!inputArquivo || !inputArquivo.files || inputArquivo.files.length === 0) {
                mensage_error_arquivo.textContent = "Selecione um arquivo antes de enviar.";
                mensage_error_arquivo.style.display = "block";
                return;
            }

            const formData = new FormData();
            const arquivo = inputArquivo.files[0];
            formData.append("arquivo", arquivo);

            const uri_post_funcionarios_arquivo = `/funcionarios/cadastrarCSV/${usuario_logado}`;

            fetch(uri_post_funcionarios_arquivo, {
                method: "POST",
                body: formData,
                headers: {
                    "Authorization": 'Bearer ' + token
                }

            }).then(res => res.json())
                .then(data => {
                    if (data.status == false) {
                        mensage_error_arquivo.textContent = data.msg || "Erro no upload.";
                        mensage_error_arquivo.style.display = "block";
                        return
                    } else {
                        alert("Arquivo enviado com sucesso!");
                        location.reload();
                    }
                }).catch(err => {
                    alert("Arquivo enviado com sucesso! funcionarios adicionados");
                    console.error(err);
                });
        }



        botaoCadastro.onclick = function () {
            cadastro_funcionario();
        }
        function cadastro_funcionario() {

            const nome = document.getElementById('nomePost');
            const email = document.getElementById('emailPost');
            const cpf = document.getElementById('cpfPost');
            const cargo = document.getElementById('cargoPost');
            const salario = document.getElementById('salarioPost');
            const contrato = document.getElementById('dataContratoPost');
            const departamento_id = document.getElementById('departamento_idPost').value;
            const senha = document.getElementById('senhaPost');
            const mensagem = document.getElementById('mensage_error_post'); // elemento de exibição de mensagem

            const jsonEnvio = {
                "nome": nome.value,
                "email": email.value,
                "cpf": cpf.value,
                "cargo": cargo.value,
                "salario": salario.value,
                "data_contratacao": contrato.value,
                "departamento_id": departamento_id,
                "senha": senha.value,
                "usuario_logado": usuario_logado
            }


            const uri_post_funcionarios = `/funcionarios/cadastrar`;

            fetch(uri_post_funcionarios, {
                method: "POST",
                body: JSON.stringify(jsonEnvio),
                headers: {
                    "Accept": "application/json",
                    "Content-Type": "application/json",
                    "Authorization": 'Bearer ' + token
                }
            })
                .then((response) => response.json())
                .then((data) => {
                    console.log(data);

                    if (data.status === false) {
                        mensagem.textContent = data.msg;
                        mensagem.style.display = "block";
                        mensagem.style.color = "red";
                    } else {
                        mensagem.textContent = "Funcionário cadastrado com sucesso!";
                        mensagem.style.display = "block";
                        mensagem.style.color = "green";

                        // Limpa os campos
                        nome.value = "";
                        email.value = "";
                        cpf.value = "";
                        cargo.value = "";
                        salario.value = "";
                        contrato.value = "";
                        departamento_id.value = "";
                        senha.value = "";
                    }
                })
                .catch((error) => {
                    console.error("Error:", error);
                    mensagem.textContent = "Erro ao cadastrar. Tente novamente.";
                    mensagem.style.display = "block";
                    mensagem.style.color = "red";
                });
        }



        document.addEventListener("DOMContentLoaded", () => {
            carregarFuncionarios(paginaAtual);

            const botaoAtualizar = document.getElementById("botaoAtualizar");

            if (botaoAtualizar) {
                botaoAtualizar.addEventListener("click", function (event) {
                    event.preventDefault();
                    update_funcionario();  // chama sua função
                });
            } else {
                console.error("botaoAtualizar não encontrado!");
            }
        });

        function update_funcionario() {
            const id = document.getElementById('id').value
            const nome = document.getElementById('nome').value
            const cpf = document.getElementById('cpf').value
            const cargo = document.getElementById('cargo').value
            const salario = document.getElementById('salario').value
            const contrato = document.getElementById('dataContrato').value

            const departamento_id = document.getElementById('departamento_id').value


            if (!id || !nome || !cargo || !contrato || !salario || !departamento_id || !cpf) {
                let text = "Preencha todos os campos"
                mensage_error.textContent = text
                mensage_error.style.display = "block";
                return;


            } else {
                mensage_error.style.display = "none";
                const jsonEnvio = {
                    "id": id,
                    "nome": nome,
                    "cpf": cpf,
                    "cargo": cargo,
                    "salario": salario,
                    "data_contratacao": contrato,
                    "departamento_id": departamento_id,
                    "usuario_logado": usuario_logado
                }


                const uri_update_funcionarios = `/funcionarios/atualizar/${id}`;
                console.log("id" + id)
                fetch(uri_update_funcionarios, {
                    method: "PUT",
                    body: JSON.stringify(jsonEnvio),
                    headers: {
                        "Accept": "application/json",
                        "Content-Type": "application/json",

                        "Authorization": 'Bearer ' + token

                    }
                }).then((response) => {
                    return response.json();
                }).then((data) => {
                    console.log(data)

                    if (data.status == false) {
                        let txt = data.msg
                        mensage_error.textContent = txt
                        mensage_error.style.display = "block";
                    } else {
                        botaoAtualizar.textContent = "Atualizado!";
                        botaoAtualizar.classList.add("sucesso");
                        setTimeout(() => {
                            botaoAtualizar.textContent = "Atualizar";
                            botaoAtualizar.classList.remove("sucesso");
                        }, 2000); // 2000 milissegundos = 2 segundos               
                    }

                }).catch((error) => {
                    console.error("Error:", error);
                })
            }
        }






    </script>
