<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>logs</title>
  <link rel="stylesheet" href="../css/logs.css" />
  <!-- BOOTSTRAP CSS e JS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar fixed-top custom-navbar">
    <div class="container-fluid justify-content-center align-items-center d-flex position-relative">
      <span class="navbar-title mx-auto">Logs - AppStorm</span>
      <button type="button" class="btn-close position-absolute start-0 ms-3" aria-label="Close"
        onclick="window.location.href='paginaAdministracao.html';"
        style="transform: scale(1.8); filter: invert(19%) sepia(99%) saturate(7074%) hue-rotate(355deg) brightness(96%) contrast(119%); z-index: 1051;">
      </button>
    </div>
  </nav>

  <!-- CONTEÚDO PRINCIPAL -->
  <div class="container table-container">

    <div class="table-responsive">
      <!-- PAGINAÇÃO -->

      <table class="table table-bordered table-hover align-middle">
        <thead>
          <tr>
            <th>Data/Hora</th>
            <th>Usuário</th>
            <th>Operação</th>
            <th>Detalhes</th>
            <th>Alterações</th>
          </tr>
        </thead>

        <tbody>
          <!-- Exemplo de linha de log -->
          <tr>
            <td>2025-04-13 14:32</td>
            <td>admin</td>
            <td class="text-danger fw-semibold">DELETE</td>
            <td>Remoção de usuário ID 42</td>
            <td>192.168.0.1</td>
          </tr>
          <!-- Outras linhas podem ser adicionadas dinamicamente -->
        </tbody>
      </table>

      <div class="d-flex justify-content-center align-items-center gap-3 mt-4">
        <button id="btnAnterior" class="btn btn-outline-secondary" onclick="paginaAnterior()">← Anterior</button>

        <nav>
          <ul class="pagination mb-0">
            <li class="page-item active"><span class="page-link" id="numPagina">1</span></li>
          </ul>
        </nav>

        <button id="btnProximo" class="btn btn-outline-secondary" onclick="proximaPagina()">Próxima →</button>
      </div>

      <!-- SPINNER -->
      <div class="text-center mt-3" id="spinnerContainer" style="display: none;">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Carregando...</span>
        </div>
      </div>
    </div>
  </div>
  <script>
    let paginaAtual = 1;
    const itensPorPagina = 5;
    let ultimaPagina = false;

    function formatarData(dataISO) {
      const data = new Date(dataISO);
      return data.toLocaleString('pt-BR', {
        timeZone: 'UTC',
        hour12: false
      });
    }



    function formatarAlteracoes(texto) {
      // Divide por ponto e vírgula e cria <li>
      if (!texto) return "<li>Nenhuma alteração registrada</li>";

      return texto.split(";").map(alt => {
        const alteracaoFormatada = alt.trim().replace("->", "→");
        return `<li>${alteracaoFormatada}</li>`;
      }).join("");
    }







    async function carregarLogs(pagina = 1) {
      try {
        mostrarSpinner(true);

        const response = await fetch(`/logs/listar/${pagina}`);
        const json = await response.json();

        if (json.status) {
          const tbody = document.querySelector("table tbody");
          tbody.innerHTML = "";

          // Atualiza a variável de última página
          ultimaPagina = json.dados.length < itensPorPagina;

          json.dados.forEach(log => {
            const linha = document.createElement("tr");

            linha.innerHTML = `
              <td>${formatarData(log.data_hora)}</td>
              <td>${log.usuario_responsavel}</td>
              <td class="fw-semibold text-${log.acao === 'DELETE' ? 'danger' : log.acao === 'UPDATE' ? 'warning' : 'success'}">${log.acao}</td>
              <td>
                <div><strong>Tabela:</strong> ${log.tabela_afetada}</div>
                <div><strong>ID:</strong> ${log.id_registro_afetado}</div>
              </td>
              <td>
                <ul class="mb-0 ps-3">
                  ${formatarAlteracoes(log.alteracoes)}
                </ul>
              </td>
            `;


            tbody.appendChild(linha);
          });

          paginaAtual = pagina;
          document.getElementById("numPagina").textContent = paginaAtual;

          // Gerenciar botões
          document.getElementById("btnAnterior").disabled = paginaAtual === 1;
          document.getElementById("btnProximo").disabled = ultimaPagina;
        } else {
          alert("Erro ao carregar logs.");
        }

      } catch (erro) {
        console.error("Erro na requisição:", erro);
      } finally {
        mostrarSpinner(false);
      }
    }

    function proximaPagina() {
      if (!ultimaPagina) {
        carregarLogs(paginaAtual + 1);
      }
    }

    function paginaAnterior() {
      if (paginaAtual > 1) {
        carregarLogs(paginaAtual - 1);
      }
    }

    function mostrarSpinner(mostrar) {
      const spinner = document.getElementById("spinnerContainer");
      spinner.style.display = mostrar ? "block" : "none";
    }

    // Carrega na inicialização
    document.addEventListener("DOMContentLoaded", () => {
      carregarLogs(paginaAtual);
    });
  </script>

</body>

</html>
